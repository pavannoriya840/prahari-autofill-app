name: Build Android APK


on:
  push:
    branches: [ main ]
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Extract source zip
      run: |
        rm -rf app-src
        mkdir -p app-src
        unzip -o prahari-autofill-app.zip -d app-src
        echo "=== Extracted structure ==="
        ls -la app-src/
        echo "=== Finding package.json ==="
        find app-src -name "package.json" -maxdepth 3
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Fix gesture-handler and install
      run: |
        PKG_DIR=$(dirname $(find app-src -name "package.json" -maxdepth 3 | head -1))
        echo "Package dir: $PKG_DIR"
        cd "$PKG_DIR"
        python3 << 'PYEOF'
        import json
        with open('package.json', 'r') as f:
            pkg = json.load(f)
        pkg['dependencies']['react-native-gesture-handler'] = '~2.16.1'
        with open('package.json', 'w') as f:
            json.dump(pkg, f, indent=2)
        print('Gesture handler fixed!')
        PYEOF
        echo "APP_SRC_DIR=$PKG_DIR" >> $GITHUB_ENV
        npm install
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Android SDK
      run: |
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'
    - name: Debug structure
      run: |
        find app-src -maxdepth 3 -type d | head -30
        find app-src -name "gradlew" | head -5
    - name: Build Release APK
      run: |
        ANDROID_DIR=$(dirname $(find app-src -name "gradlew" | head -1))
        echo "Android dir: $ANDROID_DIR"
        cd "$ANDROID_DIR"
        gradle assembleRelease --no-daemon
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: prahari-autofill-apk
        path: app-src/**/app-release.apk
