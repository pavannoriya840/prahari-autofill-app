name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Extract source zip
      run: |
        unzip -o prahari-autofill-app.zip -d app-src
        ls app-src/
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Fix gesture-handler version
      run: |
        cd app-src
        python3 -c "
        import json
        with open('package.json', 'r') as f:
            pkg = json.load(f)
        pkg['dependencies']['react-native-gesture-handler'] = '~2.16.1'
        with open('package.json', 'w') as f:
            json.dump(pkg, f, indent=2)
        print('Fixed!')
        "
        
    - name: Install dependencies
      run: |
        cd app-src
        npm install
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'
        
    - name: Build Release APK
      run: |
        cd app-src/android
        gradle assembleRelease --no-daemon
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: prahari-autofill-apk
        path: app-src/android/app/build/outputs/apk/release/app-release.apk
